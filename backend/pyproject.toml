[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "schooltrack-backend"
version = "0.1.0"
description = "SchoolTrack API: geolocation-based school attendance platform"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pyjwt>=2.10,<3",
    "argon2-cffi>=23.1",
    "tzdata>=2024.2",
    "celery[redis]>=5.4,<6",
    "redis>=5.2,<9",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx2>=2.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running PostgreSQL/PostGIS (DATABASE_URL)",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy async runs ORM code in greenlets and TestClient runs the app in a thread.
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # asserts and fictional credentials
"migrations/**" = ["E501", "S608"]   # SQL built from module constants, no user input
# Repositories compose SQL from module-level fragments; every value is a bound parameter.
"app/modules/*/repository.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# Celery ships no type information.
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.celery_app"]
disallow_untyped_decorators = false
