name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", "infrastructure/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "infrastructure/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: schooltrack
          POSTGRES_USER: schooltrack
          POSTGRES_PASSWORD: ci_owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U schooltrack -d schooltrack"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://schooltrack:ci_owner@localhost:5432/schooltrack
      DATABASE_URL: postgresql+psycopg://schooltrack_app:ci_app@localhost:5432/schooltrack
      PLATFORM_DATABASE_URL: postgresql+psycopg://schooltrack_platform:ci_platform@localhost:5432/schooltrack
      WORKER_DATABASE_URL: postgresql+psycopg://schooltrack_worker:ci_worker@localhost:5432/schooltrack
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        if: ${{ !cancelled() }}
        run: mypy app

      - name: Create runtime and platform roles (same script as docker compose)
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          PGHOST: localhost
          PGPASSWORD: ci_owner
          POSTGRES_USER: schooltrack
          POSTGRES_DB: schooltrack
          SCHOOLTRACK_APP_DB_PASSWORD: ci_app
          SCHOOLTRACK_PLATFORM_DB_PASSWORD: ci_platform
          SCHOOLTRACK_WORKER_DB_PASSWORD: ci_worker
        run: bash infrastructure/docker/postgres/initdb/20-create-app-role.sh

      - name: Migrations (upgrade, downgrade, upgrade)
        if: ${{ !cancelled() }}
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

      - name: Tests
        if: ${{ !cancelled() }}
        run: pytest --cov --cov-report=term-missing

      - name: Load test (school-opening burst against uvicorn with 2 workers)
        if: success()
        run: |
          uvicorn app.main:app_factory --factory --workers 2 --port 8000 --log-level warning &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/health/ready > /dev/null && break
            sleep 1
          done
          # NFR-PERF-1: phones arriving at 50 req/s (open loop).
          python -m loadtest.attendance_load --students 300 --rate 50 --concurrency 100
          # Saturation: how far the same setup goes with 50 requests always in flight.
          python -m loadtest.attendance_load --students 300 --concurrency 50
