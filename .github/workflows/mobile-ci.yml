name: mobile-ci

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/mobile-ci.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Expo SDK version alignment
        run: npx expo install --check

      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Bundle (Android) to catch import and Metro errors
        if: ${{ !cancelled() }}
        run: npx expo export --platform android --output-dir /tmp/expo-export

      - name: Print resolved lockfile (temporary, to commit it)
        if: ${{ hashFiles('apps/mobile/package-lock.json') != '' }}
        run: echo "LOCKFILE_B64_START $(gzip -9c package-lock.json | base64 -w0) LOCKFILE_B64_END"
