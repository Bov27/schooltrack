name: e2e

# Builds the whole stack with docker compose, loads the fictional demo data and runs
# the end-to-end smoke test: dashboard login, a live check-in, the worker notifying
# the guardian, and the admin seeing the event.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # CI-only values; nothing here protects real data.
      SCHOOLTRACK_DEMO_PASSWORD: e2e-demo-password-2026
      JWT_SECRET: e2e-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API and the dashboard
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/api/v1/health/ready >/dev/null \
              && curl -fsS -o /dev/null http://localhost:3000/login; then
              echo "Stack is up"; exit 0
            fi
            sleep 2
          done
          echo "Stack did not become ready"; exit 1

      - name: Load the demo data
        run: docker compose exec -T -e SCHOOLTRACK_DEMO_PASSWORD api python -m app.cli seed-demo

      - name: Demo data cannot be loaded twice
        run: |
          if docker compose exec -T -e SCHOOLTRACK_DEMO_PASSWORD api python -m app.cli seed-demo; then
            echo "seed-demo should refuse to run twice"; exit 1
          fi

      - name: End-to-end smoke test
        run: python3 scripts/e2e_smoke.py --api http://localhost:8000 --web http://localhost:3000

      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
