name: web-ci

on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web-ci.yml"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        # Uses the committed lockfile when present (npm ci), otherwise resolves one.
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload resolved lockfile
        if: ${{ always() && hashFiles('apps/web/package-lock.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: web-package-lock
          path: apps/web/package-lock.json
